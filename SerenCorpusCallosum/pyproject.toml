[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seren-corpus-callosum"
dynamic = ["version"]
description = "Read-only N-store memory federation for Seren. The callosum - fans Loci, SerenMemory, and any number more into one RRF-merged recall surface."
readme = "README.md"
# NO upper Python bound, and that absence is the tell of what SCC is: it NEVER
# embeds. The merge is Reciprocal Rank Fusion, which reads only each store's
# RANK ordering - so there is no sentence-transformers, no torch, anywhere in
# the tree. Loci/Memory cap <3.13 for their torch-bearing [vector] extra; the
# callosum has no such extra and no such wall. Dep-lightest service in the
# family, by construction.
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Chad Roesler" }]
keywords = ["llm", "memory", "federation", "rrf", "reciprocal-rank-fusion", "seren", "callosum"]

# Core deps are the web stack + httpx. httpx is NOT test-only here the way it
# can be elsewhere - it's the live transport the fan calls every store through,
# so it's load-bearing runtime.
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0.2",
    "httpx>=0.27.0",
    # The shared Seren core: server/tls config blocks, token resolution, the
    # version helper, the auth middleware, the viewer baseplate. Pinned <1 - a
    # MAJOR (an un-defaultable security change) is the only thing that ever
    # forces a bump here.
    "seren-meninges>=2.4.0,<3",
    # Shared request logging - one copy across the family (SerenSinew). Mounted
    # outermost (before auth) so even 401s get logged. -> corpus-callosum-requests.log.
    "seren-sinew>=1.0.0,<2",
]

[project.optional-dependencies]
# There is deliberately NO [vector] extra. The callosum is embedder-agnostic by
# design (RRF over ranks, never magnitudes) and embeds nothing of its own, so
# it never needs sqlite-vec or sentence-transformers. The absence is the point.
mcp = [
    # The Python MCP SDK (FastMCP merged in). Exposes the `search` tool so a
    # connected model can fan all stores in one call.
    #
    # THE <2 CAP IS LOAD-BEARING: mcp 2.0.0 REMOVED FastMCP outright.
    # `mcp.server.fastmcp` does not exist in 2.x; the server class is now
    # mcp.server.mcpserver.MCPServer with a different API. Last 1.x that
    # still carries FastMCP is 1.29.0. Uncapped, a fresh install resolves
    # 2.0.0, the import fails, the ImportError gate catches it exactly as
    # designed, and the service comes up in HTTP-only mode with one log
    # line - i.e. /mcp silently ceases to exist and looks like the extra
    # just wasn't installed. Cap it, don't hope.
    #
    # Lift the cap in the same commit that ports the mount to the MCPServer
    # API - across the whole family at once, since they're copies. Within
    # 1.x the pin stays loose: the mount tolerates transport-name drift.
    "mcp>=1.0,<2",
]
corp = [
    # Corp / intercepting-proxy support. Routes Python TLS through the OS trust
    # store so a corp root CA is honored on the callosum's OUTBOUND calls to an
    # https store. Opt-in: pip install 'seren-corpus-callosum[corp]' +
    # tls.trust_system_store: true (the --corp installer flag sets both).
    "truststore>=0.9",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    # Silences the starlette->httpx deprecation warning under
    # fastapi.testclient (the one the app tests emit) and future-proofs against
    # the hard cutover. Same as the rest of the family.
    "httpx2>=2.3",
]
# Kept as an EMPTY alias. Update checking is CORE in seren-meninges now, and
# meninges is already a core dependency of this service, so there is nothing
# left for this extra to install. The name stays because it appears in the
# Starwright installers (--updates), in docs, and in people's notes - and an
# unknown extra only earns a "does not provide the extra" warning that trains
# operators to ignore warnings.
updates = []

[project.scripts]
seren-corpus-callosum = "seren_corpus_callosum.__main__:main"

[project.urls]
Homepage = "https://github.com/ChadRoesler/SerenCorpusCallosum"
Repository = "https://github.com/ChadRoesler/SerenCorpusCallosum"
"Bug Tracker" = "https://github.com/ChadRoesler/SerenCorpusCallosum/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["seren_corpus_callosum*"]

# Ship the viewer fragment files inside the wheel: the leaf bricks in
# viewer/ui/ that render_from_dir snaps onto the SerenMeninges baseplate. Same
# pip-strips-non-.py gotcha as the family - without this, GET /viewer renders an
# empty shell on an installed copy.
[tool.setuptools.package-data]
seren_corpus_callosum = ["viewer/ui/*.html", "viewer/ui/*.css", "viewer/ui/*.js"]

[tool.setuptools_scm]
# .git is one level above pyproject.toml (repo root)
root = ".."
version_scheme = "release-branch-semver"
version_file = "seren_corpus_callosum/_version.py"
# Strip the leading 'v' so "v1.2.3" → "1.2.3"
tag_regex = "^v(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+.*)$"
# Used when no git tags exist (local dev, fresh clone). CI release builds
# override with SETUPTOOLS_SCM_PRETEND_VERSION.
fallback_version = "0.0.0.dev0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
